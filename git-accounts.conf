# =============================================================================
# git-accounts.conf — example configuration for setup-git-accounts.sh
#
# Based on: https://github.com/hstanda/git-accounts
#
# One [section] per Git account. Section name = short alias used for file
# names (e.g. "personal", "bernum"). Add as many sections as you need.
#
# Fields:
#   email       Git commit email for this account (also the SSH key comment)
#   name        Git commit "user.name" for this account
#   key_file    Filename (not full path) of the SSH private key, created
#               under ~/.ssh/. Public key will be "<key_file>.pub".
#   key_type    ssh-keygen key type. "ed25519" is recommended; use "rsa" if
#               the remote host is old and doesn't support ed25519.
#   host_alias  The Host alias written to ~/.ssh/config, e.g. "github-personal".
#               You'll clone/push using this instead of "github.com", e.g.:
#                 git clone git@github-personal:youruser/yourrepo.git
#   hostname    The real hostname to connect to (github.com, gitlab.com, a
#               self-hosted git server, etc.)
#   work_dir    Absolute path to the directory (repos go inside it) that
#               should automatically use this account's identity. Written
#               into ~/.gitconfig as an includeIf "gitdir:<work_dir>/" block.
#               "~" is expanded.
#   passphrase  Optional passphrase for the SSH key. Leave empty for no
#               passphrase (fine for a personal machine; ssh-agent will hold
#               the unlocked key either way once added).
# =============================================================================

[dev-personal-harjeevan]
email      = git-personal-email@example.com
name       = Harjeevan Tanda
key_file   = github-personal-harjeevan
key_type   = ssh-rsa
host_alias = github-personal-harjeevan
hostname   = github.com
work_dir   = ~/Desktop/repos/personal-harjeevan/
passphrase =